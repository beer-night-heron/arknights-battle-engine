<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARKSIM / 战术回放</title>
  <style>
    :root {
      --ink: #d8e0dd;
      --muted: #83908c;
      --panel: #101715;
      --panel-2: #141d1a;
      --line: #2b3733;
      --black: #080c0b;
      --amber: #f4b942;
      --amber-dim: #7f6127;
      --cyan: #54d9d1;
      --red: #ff665e;
      --green: #8ecb64;
      --cell: 52px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--black);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      letter-spacing: .02em;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 3px, #cad6d105 3px 4px),
        radial-gradient(circle at 18% 0%, #f4b94216, transparent 32%);
      mix-blend-mode: screen;
    }
    button, select, input { font: inherit; }
    button, select {
      color: var(--ink);
      border: 1px solid var(--line);
      background: #18211e;
      min-height: 34px;
    }
    button { cursor: pointer; padding: 0 12px; }
    button:hover, button.active { border-color: var(--amber); color: var(--amber); }
    .exit-file-button { align-self: center; margin: 0 18px 0 10px; border-color: var(--amber-dim); }
    .data-loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #080c0be8;
    }
    .data-loader[hidden] { display: none; }
    .data-loader-panel {
      width: min(440px, calc(100vw - 40px));
      padding: 28px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .data-loader-panel h2 { margin: 0 0 12px; }
    .data-loader-panel p { color: var(--muted); line-height: 1.6; }
    .data-loader-panel input { max-width: 100%; }
    .data-loader-error { color: var(--red) !important; }
    select { padding: 0 34px 0 10px; }
    .app {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 62px minmax(0, 1fr) 94px;
    }
    header {
      min-width: 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: stretch;
      background: #0d1311ee;
      z-index: 2;
    }
    .brand {
      width: 280px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 20px;
      border-right: 1px solid var(--line);
    }
    .brand-mark {
      width: 31px;
      height: 31px;
      border: 2px solid var(--amber);
      transform: rotate(45deg);
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid var(--cyan);
    }
    .brand strong { display: block; font-size: 17px; letter-spacing: .18em; }
    .brand small { color: var(--muted); font-family: Consolas, monospace; }
    .header-stat {
      min-width: 116px;
      padding: 10px 16px 7px;
      border-right: 1px solid var(--line);
    }
    .header-stat span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; }
    .header-stat b { display: block; margin-top: 3px; font: 20px/1 Consolas, monospace; color: var(--amber); }
    .case-control { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
    .case-control label { color: var(--muted); font-size: 11px; letter-spacing: .13em; }
    main {
      min-height: 0;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 320px;
    }
    .stage {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border-right: 1px solid var(--line);
      position: relative;
    }
    .map-wrap {
      min-height: 0;
      position: relative;
      background-color: #0b100e;
      background-image:
        linear-gradient(#18211e55 1px, transparent 1px),
        linear-gradient(90deg, #18211e55 1px, transparent 1px);
      background-size: 24px 24px;
    }
    #map { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .map-legend {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #0d1311;
    }
    .chip {
      padding: 4px 7px;
      border: 1px solid #ffffff18;
      background: #090d0cce;
      color: var(--muted);
      font-size: 10px;
      font-family: Consolas, monospace;
    }
    .chip i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--dot); }
    .chip .circle { border-radius: 50%; }
    .chip .diamond { transform: rotate(45deg); }
    .chip .portal { border: 2px solid var(--dot); border-radius: 50%; background: transparent; }
    .chip .muzzle-cross { background: transparent; position: relative; }
    .chip .muzzle-cross::before, .chip .muzzle-cross::after { content: ''; position: absolute; background: var(--dot); }
    .chip .muzzle-cross::before { width: 10px; height: 2px; left: -1px; top: 3px; }
    .chip .muzzle-cross::after { width: 2px; height: 10px; left: 3px; top: -1px; }
    #muzzleLegend[hidden] { display: none; }
    .map-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }
    .inspector {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }
    .entity-card { padding: 20px 18px; }
    .eyebrow { color: var(--amber); font: 10px Consolas, monospace; letter-spacing: .16em; }
    .entity-card h2 { margin: 8px 0 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
    .entity-grid { display: grid; gap: 12px; margin-top: 22px; font: 11px Consolas, monospace; color: var(--muted); }
    .entity-field { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; min-width: 0; }
    .entity-grid b { color: var(--ink); font-weight: 400; overflow-wrap: anywhere; }
    .sp-panel { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .sp-label { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); }
    .sp-label b { color: var(--cyan); font: 11px Consolas, monospace; }
    .sp-track { height: 7px; margin: 8px 0 14px; background: #28332e; overflow: hidden; }
    .sp-fill { height: 100%; background: var(--cyan); }
    .sp-track.slot .sp-fill { background: var(--amber); }
    .sp-help { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .reserve { min-height: 108px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
    .reserve-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 11px; }
    .reserve-head span { color: var(--muted); font-size: 10px; }
    .reserve-cards { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
    .reserve-card { flex: 0 0 132px; min-height: 60px; padding: 9px 10px; text-align: left; }
    .reserve-card strong { display: block; font-size: 12px; }
    .reserve-card small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .reserve-empty { margin: 8px 0; color: var(--muted); font-size: 11px; }
    aside {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--panel-2);
    }
    .aside-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
    .aside-head h2 { margin: 0 0 3px; font-size: 15px; letter-spacing: .1em; }
    .aside-head p { margin: 0; color: var(--muted); font-size: 11px; }
    .filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .filters button { min-height: 27px; padding: 0 8px; font-size: 10px; }
    .events { overflow: auto; scrollbar-color: var(--amber-dim) #0d1311; }
    .event {
      display: grid;
      grid-template-columns: 56px 9px 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px 12px;
      border-bottom: 1px solid #ffffff0a;
      cursor: pointer;
      font-size: 11px;
    }
    .event:hover, .event.now { background: #f4b9420b; }
    .event time { color: var(--muted); font-family: Consolas, monospace; }
    .event .dot { width: 7px; height: 7px; margin-top: 3px; border: 1px solid currentColor; transform: rotate(45deg); }
    .event strong { display: block; font-weight: 500; color: var(--ink); }
    .event small { display: block; color: var(--muted); margin-top: 2px; font-family: Consolas, monospace; }
    footer {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr) minmax(300px, 360px);
      border-top: 1px solid var(--line);
      background: #0d1311;
    }
    .transport { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-right: 1px solid var(--line); }
    .transport button { width: 38px; padding: 0; font-family: Consolas, monospace; }
    .speed { flex: 1 1 148px; width: auto; min-width: 132px; }
    .timeline { min-width: 0; padding: 12px 18px; display: grid; grid-template-rows: 24px 1fr; }
    .timeline-top { display: flex; justify-content: space-between; font: 11px Consolas, monospace; color: var(--muted); }
    .timeline-top b { color: var(--ink); }
    .track { position: relative; display: flex; align-items: center; }
    #markers { position: absolute; inset: 5px 0 auto; width: 100%; height: 15px; pointer-events: none; }
    #timeline { width: 100%; accent-color: var(--amber); position: relative; z-index: 2; }
    .toggles { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-left: 1px solid var(--line); }
    .toggles button { flex: 1; font-size: 10px; padding-inline: 5px; white-space: nowrap; }
    .toggles button:disabled { opacity: .4; cursor: default; border-color: var(--line); color: var(--muted); }
    @media (max-width: 1050px) {
      .entity-card { padding: 16px 14px; }
      main { grid-template-columns: 210px minmax(0, 1fr) 250px; }
      footer { grid-template-columns: 330px minmax(180px, 1fr) 300px; }
      .brand { width: 210px; padding-inline: 14px; }
      .header-stat { min-width: 96px; padding-inline: 10px; }
      .header-stat b { font-size: 17px; }
      .case-control { padding-inline: 8px; }
      .case-control label { display: none; }
      header > .header-stat:nth-of-type(4) { display: none; }
      .transport { padding-inline: 10px; gap: 4px; }
      .speed { min-width: 118px; font-size: 10px; }
      .toggles { gap: 4px; padding-inline: 9px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="brand-mark"></div><div><strong>ARKSIM</strong><small id="stageLabel">TACTICAL REPLAY</small></div></div>
      <div class="header-stat"><span>战斗时刻</span><b id="clock">000.000</b></div>
      <div class="header-stat"><span>生命 / 费用</span><b><i id="life">—</i> / <i id="dp">—</i></b></div>
      <div class="header-stat"><span>击杀 / 生成</span><b><i id="killed">0</i> / <i id="spawned">0</i></b></div>
      <div class="case-control"><label for="caseSelect">模拟方案</label><select id="caseSelect"></select></div>
      <button id="closeDataBtn" class="exit-file-button" type="button" hidden>退出当前文件</button>
    </header>

    <main>
      <section class="inspector" aria-label="选中单位状态">
        <div class="entity-card">
          <div class="eyebrow">SELECTED ENTITY / 单位状态</div>
          <h2 id="entityName">未选择实体</h2>
          <div class="entity-grid" id="entityGrid"></div>
          <div id="spPanel"></div>
          <p class="map-note" id="mapNote">点击地图单位或待部署卡片查看状态。按 Space 播放，←/→ 逐帧。</p>
        </div>
      </section>
      <section class="stage">
        <div class="map-legend" id="mapLegend" aria-label="地图图例"></div>
        <div class="map-wrap">
          <canvas id="map"></canvas>
        </div>
        <div class="reserve" aria-label="待部署区">
          <div class="reserve-head"><b>待部署区</b><span>点击卡片查看 · 回放只读</span></div>
          <div class="reserve-cards" id="reserveCards"></div>
        </div>
      </section>

      <aside>
        <div class="aside-head"><h2>事件流</h2><p>事件按战斗时间排列，点击可跳转。</p></div>
        <div class="filters" id="filters"></div>
        <div class="events" id="events"></div>
      </aside>
    </main>

    <footer>
      <div class="transport">
        <button id="reset" title="回到开始">|◀</button>
        <button id="stepBack" title="上一帧">◀</button>
        <button id="play" title="播放/暂停">▶</button>
        <button id="stepNext" title="下一帧">▶|</button>
        <select id="speed" class="speed" aria-label="回放速度"><option value="0.5">0.5× · 15 帧/秒</option><option value="1" selected>1× · 30 帧/秒</option><option value="2">2× · 60 帧/秒</option><option value="3">3× · 90 帧/秒</option><option value="4">4× · 120 帧/秒</option><option value="8">8× · 240 帧/秒</option></select>
      </div>
      <div class="timeline">
        <div class="timeline-top"><span>FRAME <b id="frameIndex">0</b></span><span id="statusLine">READY</span><span>END <b id="endTime">0.0</b>s</span></div>
        <div class="track"><canvas id="markers"></canvas><input id="timeline" type="range" min="0" value="0"></div>
      </div>
      <div class="toggles"><button id="togglePath" class="active">目标路径 P</button><button id="toggleRange" class="active">攻击范围 R</button><button id="toggleIds" class="active">实体编号 I</button><button id="toggleMuzzle" aria-pressed="false" title="显示敌方出手挂点，快捷键 M">出手挂点 M</button></div>
    </footer>
  </div>

  <div id="dataLoader" class="data-loader" hidden>
    <div class="data-loader-panel">
      <h2>打开回放数据</h2>
      <p>选择本地 JSON 数据文件。页面读取本地模拟数据，不会上传文件。最新文件位于 local/最新模拟/replay.json。</p>
      <input id="dataFile" type="file" accept=".json,application/json" aria-label="选择回放数据文件">
      <p id="dataLoaderStatus" role="status"></p>
    </div>
  </div>

  <script>
    const EMBEDDED_DATA = null;
    function startReplay(DATA) {
    const COLORS = {
      ink:'#d8e0dd', muted:'#83908c', amber:'#f4b942', cyan:'#54d9d1', red:'#ff665e', green:'#8ecb64',
      elite:'#f49b58', boss:'#e783c6', portal:'#a88ee8'
    };
    // Keep the legend and map rendering on the same palette.
    const legendItems = [
      ['蓝门', COLORS.cyan, ''], ['红门', COLORS.red, ''],
      ['干员', COLORS.amber, 'diamond'], ['普通敌人', COLORS.red, 'circle'],
      ['精英敌人', COLORS.elite, 'circle'], ['领袖敌人', COLORS.boss, 'circle'],
      ['传送门', COLORS.portal, 'portal']
    ];
    const state = { caseIndex:0, frameIndex:0, playheadTime:0, playing:false, speed:1, selected:{type:'operator',id:null}, filters:new Set(['major']), path:true, range:true, ids:true, muzzle:false, lastStamp:0 };
    const el = id => document.getElementById(id);
    const canvas = el('map'), ctx = canvas.getContext('2d');
    const markerCanvas = el('markers'), markerCtx = markerCanvas.getContext('2d');
    const eventGroups = {
      major:['deploy','skill_cast','skill_active','skill_end','mode_change','operator_death','enemy_death','leak','life_change','retreat','operation','wave_ready','wave_timeout'],
      operations:['operation','mode_change','wave_ready','wave_timeout'],
      damage:['enemy_damage','operator_damage','projectile_launch','projectile_end'],
      movement:['spawn','block','unblock','disappear','appear']
    };
    const escapeText = value => String(value).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
    const hiddenEventKinds = new Set(['highland_trigger', 'highland_effect']);
    const eventColor = kind => kind.includes('damage') || kind.includes('death') || kind==='leak' ? COLORS.red : kind.includes('skill') ? COLORS.amber : kind==='spawn' || kind==='appear' ? COLORS.green : COLORS.cyan;
    const enemyColor = enemy => enemy.levelType==='BOSS' ? COLORS.boss : enemy.levelType==='ELITE' ? COLORS.elite : enemy.levelType==='NORMAL' ? COLORS.red : COLORS.muted;
    const enemyCategory = enemy => ({NORMAL:'普通敌人', ELITE:'精英敌人', BOSS:'领袖敌人'}[enemy.levelType] || '类型未记录');
    const currentCase = () => DATA.cases[state.caseIndex];
    function currentFrame(){return currentCase().frames[state.frameIndex];}
    function playbackEndIndex(){return currentCase().frames.length-1;}
    const fmt = value => Number(value).toFixed(2).replace(/\.00$/,'');
    function resizeCanvas(target, context) {
      const rect = target.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
      target.width = Math.max(1, Math.round(rect.width * ratio)); target.height = Math.max(1, Math.round(rect.height * ratio));
      context.setTransform(ratio,0,0,ratio,0,0); return rect;
    }
    function geometry(target=canvas) {
      const rect = target.getBoundingClientRect(), map = DATA.map;
      const cell = Math.min((rect.width-54)/map.width,(rect.height-54)/map.height);
      return {cell, ox:(rect.width-map.width*cell)/2, oy:(rect.height-map.height*cell)/2, h:map.height};
    }
    function xy(r,c,g){ return [g.ox+(c+.5)*g.cell,g.oy+(g.h-r-.5)*g.cell]; }
    const hasMuzzle = entity => Number.isFinite(entity.muzzle?.r) && Number.isFinite(entity.muzzle?.c);
    function drawMuzzles(frame, g) {
      if (!state.muzzle) return;
      ctx.save();
      for (const enemy of frame.enemies) {
        if (enemy.hidden || !hasMuzzle(enemy)) continue;
        const selected=state.selected.type==='enemy' && state.selected.id===enemy.id;
        const [x,y]=xy(enemy.r,enemy.c,g), [mx,my]=xy(enemy.muzzle.r,enemy.muzzle.c,g);
        const size=Math.max(4,Math.min(7,g.cell*.09));
        ctx.strokeStyle=COLORS.cyan;ctx.globalAlpha=selected?1:.6;ctx.lineWidth=selected?1.5:1;
        ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(mx,my);ctx.stroke();ctx.setLineDash([]);
        ctx.globalAlpha=1;
        ctx.fillStyle='#07100f';ctx.beginPath();ctx.arc(mx,my,size*.7,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.moveTo(mx-size,my);ctx.lineTo(mx+size,my);ctx.moveTo(mx,my-size);ctx.lineTo(mx,my+size);
        ctx.strokeStyle='#07100f';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle=COLORS.cyan;ctx.lineWidth=1.5;ctx.stroke();
        if(selected){ctx.strokeStyle=COLORS.cyan;ctx.lineWidth=1;ctx.beginPath();ctx.arc(mx,my,size+3,0,Math.PI*2);ctx.stroke();ctx.fillStyle=COLORS.cyan;ctx.font='10px Consolas';ctx.textAlign='left';ctx.fillText(`M#${enemy.id}`,mx+size+5,my-5);}
      }
      ctx.restore();
    }
    function tileStyle(tile) {
      if(tile.key==='tile_end') return ['#113d3c',COLORS.cyan];
      if(tile.key==='tile_start') return ['#3a1e1d',COLORS.red];
      if(['tile_telin','tile_telout'].includes(tile.key)) return ['#241c36',COLORS.portal];
      if(tile.height==='HIGHLAND' && tile.build==='RANGED') return ['#352f22','#766335'];
      if(tile.pass==='FLY_ONLY') return ['#0a0e0d','#202925'];
      if(tile.key==='tile_road') return ['#202b27','#3b4944'];
      return ['#18211e','#303d38'];
    }
    function drawMap() {
      const rect=resizeCanvas(canvas,ctx), g=geometry(), frame=currentFrame(), map=DATA.map;
      ctx.clearRect(0,0,rect.width,rect.height);
      if (rect.width <= 54 || rect.height <= 54) return;
      for(let r=0;r<map.height;r++) for(let c=0;c<map.width;c++){
        const tile=map.cells[r][c], [fill,stroke]=tileStyle(tile), x=g.ox+c*g.cell, y=g.oy+(map.height-r-1)*g.cell;
        ctx.fillStyle=fill; ctx.fillRect(x+1,y+1,g.cell-2,g.cell-2); ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.strokeRect(x+1.5,y+1.5,g.cell-3,g.cell-3);
        if(tile.height==='HIGHLAND' && tile.build==='RANGED'){
          ctx.strokeStyle='#f4b94222'; ctx.beginPath(); ctx.moveTo(x+5,y+g.cell-5); ctx.lineTo(x+g.cell-5,y+5); ctx.stroke();
        }
        if(tile.key==='tile_end'){ctx.fillStyle=COLORS.cyan;ctx.font=`600 ${Math.max(10,g.cell*.2)}px Consolas`;ctx.textAlign='center';ctx.fillText('BLUE',x+g.cell/2,y+g.cell*.57);}
        if(tile.key==='tile_start'){ctx.fillStyle=COLORS.red;ctx.font=`600 ${Math.max(10,g.cell*.2)}px Consolas`;ctx.textAlign='center';ctx.fillText('RED',x+g.cell/2,y+g.cell*.57);}
        if(['tile_telin','tile_telout'].includes(tile.key)){
          ctx.strokeStyle=COLORS.portal;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x+g.cell/2,y+g.cell*.42,g.cell*.15,g.cell*.21,0,0,Math.PI*2);ctx.stroke();
          ctx.fillStyle=COLORS.portal;ctx.font=`600 ${Math.max(9,g.cell*.16)}px Consolas`;ctx.textAlign='center';ctx.fillText(tile.key==='tile_telin'?'IN':'OUT',x+g.cell/2,y+g.cell*.83);
        }
      }
